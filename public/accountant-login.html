<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/ff-csp.js"></script><script src="/_gen/ff-handlers.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinFlow — Accountant Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/accountant-login-01.css">
<link rel="stylesheet" href="/css/phone-targets.css">
</head>
<body>
<main>

<nav>
  <div>
    <a href="/" class="nav-brand">FinFlow</a>
    <div class="nav-sub">Accountant Portal</div>
  </div>
  <div class="nav-right">
    <a href="/app" class="nav-link">Are you a client? <span data-style="color:var(--gold-dim)">Sign up →</span></a>
  </div>
</nav>

<div class="page">
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your FinFlow accountant dashboard</div>

    <div class="error" id="error-msg"></div>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@yourfirm.com" autocomplete="email" data-on-keydown="if(event.key==='Enter')login()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password" data-on-keydown="if(event.key==='Enter')login()">
    </div>
    <div class="form-group" id="mfa-group" data-style="display:none">
      <label>Authenticator code</label>
      <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" id="mfa-code" placeholder="6-digit code" data-on-keydown="if(event.key==='Enter')login()">
    </div>

    <button class="btn-primary" id="login-btn" data-on-click="login()">Sign in →</button>

    <div class="split">
      <div class="split-line"></div>
      <div class="split-text">or</div>
      <div class="split-line"></div>
    </div>

    <hr class="divider" data-style="margin:0 0 20px">

    <div class="footer-links">
      <a href="/join">New to FinFlow? <span>Register as an accountant →</span></a>
      <a href="/app">Are you a client? <span>Sign up here →</span></a>
    </div>
  </div>
</div>

<script src="/js/accountant-login-01-login.js"></script>
</main>
</body>
</html>
