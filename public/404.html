<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FinFlow — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e0c;--card:#1a1a15;--gold:#c9a84c;--gold-light:#e8cc7a;--text:#f0ead6;--text2:#b3ab90;--border:#2a2820;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;}
  header{border-bottom:1px solid var(--border);padding:18px 32px;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);letter-spacing:.05em;text-decoration:none;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
  h1{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:400;margin-bottom:10px;}
  p{font-size:15px;color:var(--text2);margin-bottom:28px;max-width:440px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{display:inline-block;padding:11px 22px;border-radius:8px;text-decoration:none;font-size:14px;min-height:44px;}
  .primary{background:var(--gold);color:#16120d;font-weight:500;}
  .ghost{border:1px solid var(--border);color:var(--text);}
  .primary:hover{background:var(--gold-light);} .ghost:hover{border-color:var(--gold);}
</style>
</head>
<body>
<header><a class="brand" href="/">FinFlow</a></header>
<main>
  <h1>Page not found</h1>
  <p>There is no page at this address. It may have moved, or the link may be mistyped.</p>
  <div class="actions">
    <a class="btn primary" href="/app">Open FinFlow</a>
    <a class="btn ghost" href="/">Go to the home page</a>
  </div>
</main>
</body>
</html>
